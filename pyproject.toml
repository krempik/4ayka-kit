[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayka-kit"
version = "0.1.0"
description = "AI-friendly framework toolkit: spec-driven FastAPI codegen + project context scanner + reusable building blocks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "4ayka Studio" }]
keywords = ["codegen", "scaffold", "fastapi", "ai", "context", "scanner"]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/krempik/4ayka-kit"

[project.scripts]
ayka = "ayka.cli:main"

[tool.setuptools.packages.find]
include = ["ayka*"]

[tool.pytest.ini_options]
testpaths = ["tests"]